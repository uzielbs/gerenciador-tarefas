{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Criar Conta</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>📋 Criar Conta</h1>

        <form method="post" style="display:flex; flex-direction:column; gap:14px;">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label><strong>{{ field.label }}</strong></label>
                    {{ field }}
                    {% if field.errors %}
                        <p style="color:red; font-size:0.85rem;">{{ field.errors }}</p>
                    {% endif %}
                    {% if field.help_text %}
                        <p style="color:#888; font-size:0.8rem;">{{ field.help_text }}</p>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" style="padding:10px; background:#1a73e8; color:white; border:none; border-radius:8px; font-size:1rem; cursor:pointer;">
                Criar Conta
            </button>
        </form>

        <p style="margin-top:20px; text-align:center;">
            Já tem conta? <a href="/accounts/login/">Faça login</a>
        </p>
    </div>
</body>
</html>
